name: Nightly maintenance

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger maintenance sweep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET GitHub secret is not set" >&2
            exit 1
          fi
          code=$(curl -sS -o body.txt -w "%{http_code}" \
            --max-time 290 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://app.pekaar.tech/api/cron/maintenance)
          echo "HTTP ${code}"
          cat body.txt
          test "${code}" = "200"
